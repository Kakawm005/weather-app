<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Digite o nome da cidade" spellcheck="false">
            <button onclick="buscarClima('Germany')"><img src="images/search.png" alt="search button"></button>
        </div>
        <div class="weather">
            <div class="temp">
                <img src="images/clear.png" alt="clear weather">
                <h1>22°c</h1>
                <p>New York</p>
            </div>
            <p id="response">adsadsads</p>
            <div class="informations">
                <div>
                    <img src="images/humidity.png" alt="humidity">
                    <span>64%</span>
                    <p>humidty</p>
                </div>
                <div>
                    <img src="images/wind.png" alt="wind speed">
                    <span>64 km/h</span>
                    <p>Wind Speed</p>
                </div>                
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
